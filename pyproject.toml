[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sc2tray"
version = "0.1.0"
description = "Windows 11 system tray app for Steam Controller 2 battery and connection status"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "hidapi>=0.14",
    "pystray>=0.19",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
sc2tray-cli = "sc2tray.__main__:main"

[project.gui-scripts]
sc2tray = "sc2tray.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
