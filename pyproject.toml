[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sc2tray"
version = "0.1.1"
description = "Windows 11 system tray app for Steam Controller 2 battery and connection status"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Vicente Zamora" }]
keywords = ["steam-controller", "battery", "tray", "windows", "hid"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.10"
dependencies = [
    "hidapi>=0.14",
    "pystray>=0.19",
    "Pillow>=10",
]

[project.urls]
Homepage = "https://github.com/vicentzamoras/controller-windows-widget"
Issues = "https://github.com/vicentzamoras/controller-windows-widget/issues"

[project.optional-dependencies]
dev = ["pytest", "pyinstaller", "resvg-py"]    # resvg-py: tools/import_icons.py only

[project.scripts]
sc2tray-cli = "sc2tray.__main__:main"

[project.gui-scripts]
sc2tray = "sc2tray.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sc2tray = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
